<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paste</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #f0f0f0;
      --muted: #9a9a9a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
  }
  main {
    max-width: 28rem;
    width: 100%;
    text-align: center;
  }
  .glyph {
    font-size: 2.5rem;
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 1rem;
    color: var(--muted);
  }
  #status {
    font-size: 1rem;
    line-height: 1.5;
    margin: 0;
    word-break: break-word;
  }
  body.paste-frame {
    display: block;
    padding: 0;
  }
  body.paste-frame iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<main>
  <div class="glyph">🔒</div>
  <h1>paste</h1>
  <p id="status">Loading…</p>
</main>
<script>
function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function showHelp() {
  setStatus('This is a personal paste viewer. Links look like #<id>.<key>. Nothing to see without a link.');
}

function showLoading() {
  setStatus('Decrypting…');
}

function showError(message) {
  setStatus(message);
}

function base64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function base64UrlToBytes(b64url) {
  const padLength = (4 - (b64url.length % 4)) % 4;
  const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat(padLength);
  return base64ToBytes(b64);
}

function bytesToBase64(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function textToBase64(text) {
  return bytesToBase64(new TextEncoder().encode(text));
}

function hexToBytes(hex) {
  if (hex.length === 0 || hex.length % 2 !== 0) throw new Error('invalid hex length');
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) {
    const byte = parseInt(hex.substr(i * 2, 2), 16);
    if (Number.isNaN(byte)) throw new Error('invalid hex byte');
    bytes[i] = byte;
  }
  return bytes;
}

function consumeFragment() {
  const raw = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
  if (raw) {
    sessionStorage.setItem('paste', raw);
    history.replaceState(null, '', location.pathname + location.search);
    return raw;
  }
  return sessionStorage.getItem('paste') || '';
}

function parseLink(raw) {
  const dotIndex = raw.indexOf('.');
  if (dotIndex === -1) throw new Error('missing dot');
  const gistId = raw.slice(0, dotIndex);
  const keyBytes = base64UrlToBytes(raw.slice(dotIndex + 1));
  if (keyBytes.length !== 64) throw new Error('wrong key length');
  return { gistId, keyBytes };
}

class NotFoundError extends Error {}
class NetworkError extends Error {}
class RateLimitError extends Error {}
class NotAPasteError extends Error {}

async function fetchPasteText(gistId) {
  let response;
  try {
    response = await fetch('https://api.github.com/gists/' + gistId, { cache: 'no-store' });
  } catch (e) {
    throw new NetworkError('Could not load paste. ' + e.message);
  }

  if (response.status === 404) throw new NotFoundError();

  if ((response.status === 403 || response.status === 429) && response.headers.get('x-ratelimit-remaining') === '0') {
    const resetAt = parseInt(response.headers.get('x-ratelimit-reset'), 10) * 1000;
    const minutes = Math.max(1, Math.ceil((resetAt - Date.now()) / 60000));
    throw new RateLimitError('GitHub API rate limit reached. Try again in ' + minutes + ' minute' + (minutes === 1 ? '' : 's') + '.');
  }

  if (!response.ok) throw new NetworkError('Could not load paste. (' + response.status + ' ' + response.statusText + ')');

  const data = await response.json();
  const file = data.files && data.files['p.txt'];
  if (!file) throw new NotAPasteError();

  if (file.truncated) {
    let rawResponse;
    try {
      rawResponse = await fetch(file.raw_url, { cache: 'no-store' });
    } catch (e) {
      throw new NetworkError('Could not load paste. ' + e.message);
    }
    if (!rawResponse.ok) throw new NetworkError('Could not load paste. (' + rawResponse.status + ' ' + rawResponse.statusText + ')');
    return rawResponse.text();
  }

  return file.content;
}

async function decryptPaste(rawText, keyBytes) {
  const cleaned = rawText.replace(/\s+/g, '');
  const lastDot = cleaned.lastIndexOf('.');
  if (lastDot === -1) throw new Error('missing mac separator');

  const payloadBytes = base64ToBytes(cleaned.slice(0, lastDot));
  const macBytes = hexToBytes(cleaned.slice(lastDot + 1));

  const hmacKey = await crypto.subtle.importKey('raw', keyBytes.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  const macValid = await crypto.subtle.verify('HMAC', hmacKey, macBytes, payloadBytes);
  if (!macValid) throw new MacError();

  const iv = payloadBytes.slice(0, 16);
  const ciphertext = payloadBytes.slice(16);
  const aesKey = await crypto.subtle.importKey('raw', keyBytes.slice(0, 32), { name: 'AES-CTR' }, false, ['decrypt']);
  const plaintextBytes = await crypto.subtle.decrypt({ name: 'AES-CTR', counter: iv, length: 128 }, aesKey, ciphertext);
  return new TextDecoder().decode(plaintextBytes);
}

class MacError extends Error {}

function posixDirname(path) {
  const idx = path.lastIndexOf('/');
  return idx === -1 ? '' : path.slice(0, idx);
}

function normalizePosixPath(path) {
  const stack = [];
  for (const part of path.split('/')) {
    if (part === '' || part === '.') continue;
    if (part === '..') stack.pop();
    else stack.push(part);
  }
  return stack.join('/');
}

function resolveBundlePath(basePath, ref) {
  const dir = posixDirname(basePath);
  return normalizePosixPath(dir ? dir + '/' + ref : ref);
}

function isExternalRef(ref) {
  return ref.startsWith('#') || ref.startsWith('//') || /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(ref);
}

function stripQueryAndFragment(ref) {
  return ref.split('#')[0].split('?')[0];
}

function resolveBundleRef(basePath, ref) {
  if (!ref || isExternalRef(ref)) return null;
  const clean = stripQueryAndFragment(ref);
  return clean ? resolveBundlePath(basePath, clean) : null;
}

function isBundle(parsed) {
  return !!parsed && typeof parsed === 'object' &&
    typeof parsed.entry === 'string' &&
    !!parsed.files && typeof parsed.files === 'object';
}

function tryParseBundle(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return null;
  }
  return isBundle(parsed) ? parsed : null;
}

function assetDataUri(file) {
  const b64 = file.b64 !== undefined ? file.b64 : textToBase64(file.text);
  return 'data:' + file.type + ';base64,' + b64;
}

function inlineCssUrls(cssText, bundle, cssPath) {
  return cssText.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (match, quote, ref) => {
    const key = resolveBundleRef(cssPath, ref);
    const asset = key && bundle.files[key];
    return asset ? 'url(' + assetDataUri(asset) + ')' : match;
  });
}

function injectNavScript(doc, path, bundleKeys) {
  const script = doc.createElement('script');
  script.textContent = [
    'var BASE_PATH = ' + JSON.stringify(path) + ';',
    'var BUNDLE_KEYS = ' + JSON.stringify(bundleKeys) + ';',
    posixDirname.toString(),
    normalizePosixPath.toString(),
    resolveBundlePath.toString(),
    isExternalRef.toString(),
    stripQueryAndFragment.toString(),
    resolveBundleRef.toString(),
    'document.addEventListener("click", function (event) {',
    '  var anchor = event.target.closest("a[href]");',
    '  if (!anchor) return;',
    '  var target = resolveBundleRef(BASE_PATH, anchor.getAttribute("href"));',
    '  if (!target || BUNDLE_KEYS.indexOf(target) === -1) return;',
    '  event.preventDefault();',
    '  parent.postMessage(target, "*");',
    '});'
  ].join('\n');
  doc.body.appendChild(script);
}

function renderBundlePage(bundle, path) {
  const file = bundle.files[path];
  const doc = new DOMParser().parseFromString(file.text, 'text/html');

  doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach((link) => {
    const key = resolveBundleRef(path, link.getAttribute('href'));
    const cssFile = key && bundle.files[key];
    if (!cssFile) return;
    const style = doc.createElement('style');
    style.textContent = inlineCssUrls(cssFile.text, bundle, key);
    link.replaceWith(style);
  });

  doc.querySelectorAll('script[src]').forEach((script) => {
    const key = resolveBundleRef(path, script.getAttribute('src'));
    const jsFile = key && bundle.files[key];
    if (!jsFile) return;
    const inline = doc.createElement('script');
    inline.textContent = jsFile.text;
    script.replaceWith(inline);
  });

  doc.querySelectorAll('img[src], source[src]').forEach((el) => {
    const key = resolveBundleRef(path, el.getAttribute('src'));
    const asset = key && bundle.files[key];
    if (!asset) return;
    el.setAttribute('src', assetDataUri(asset));
  });

  doc.querySelectorAll('img[srcset], source[srcset]').forEach((el) => {
    const rewritten = el.getAttribute('srcset').split(/\s*,\s*/).map((candidate) => {
      const [url, ...descriptor] = candidate.split(/\s+/);
      const key = resolveBundleRef(path, url);
      const asset = key && bundle.files[key];
      const resolvedUrl = asset ? assetDataUri(asset) : url;
      return [resolvedUrl, ...descriptor].join(' ');
    });
    el.setAttribute('srcset', rewritten.join(', '));
  });

  injectNavScript(doc, path, Object.keys(bundle.files));

  return '<!doctype html>' + doc.documentElement.outerHTML;
}

function renderPaste(plaintext) {
  const bundle = tryParseBundle(plaintext);

  const iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts allow-popups');

  document.body.innerHTML = '';
  document.body.classList.add('paste-frame');
  document.body.appendChild(iframe);

  if (!bundle) {
    iframe.srcdoc = plaintext;
    return;
  }

  const bundleKeys = Object.keys(bundle.files);
  window.addEventListener('message', (event) => {
    if (typeof event.data !== 'string' || !bundleKeys.includes(event.data)) return;
    iframe.srcdoc = renderBundlePage(bundle, event.data);
  });
  iframe.srcdoc = renderBundlePage(bundle, bundle.entry);
}

async function main() {
  const fragment = consumeFragment();
  if (!fragment) {
    showHelp();
    return;
  }

  let gistId, keyBytes;
  try {
    ({ gistId, keyBytes } = parseLink(fragment));
  } catch (e) {
    showError('Malformed link');
    return;
  }

  showLoading();

  let rawText;
  try {
    rawText = await fetchPasteText(gistId);
  } catch (e) {
    if (e instanceof NotFoundError) showError('Paste not found — it may have been deleted.');
    else if (e instanceof NotAPasteError) showError('This does not look like a paste (missing p.txt).');
    else showError(e.message);
    return;
  }

  let plaintext;
  try {
    plaintext = await decryptPaste(rawText, keyBytes);
  } catch (e) {
    showError('Wrong key or corrupted paste.');
    return;
  }

  try {
    renderPaste(plaintext);
  } catch (e) {
    showError('Malformed paste bundle.');
  }
}

window.addEventListener('hashchange', main);
main();
</script>
</body>
</html>
